<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#e7f4ee">
  <meta name="description" content="Enregistrer ma PFMP — Lycée Les Eucalyptus : formulaire en ligne des élèves.">
  <title>Enregistrer ma PFMP — Lycée Les Eucalyptus</title>
  <style>
    /* Affiché dans ce cadre, le formulaire n'a pas le bandeau Google « Cette application a été créée par un
       utilisateur de Google Apps Script » (vérifié sans compte, sur téléphone et sur ordinateur). */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f4f6f9; }
    .cadre { position: fixed; inset: 0; overflow: hidden; background: #f4f6f9; }
    iframe {
      display: block; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f6f9;
    }
    #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #f4f6f9; font: 16px Arial, sans-serif; color: #16302a; z-index: 2; text-align: center; padding: 16px; }
    #chargement[hidden] { display: none; }
    #chargement i { width: 34px; height: 34px; border: 4px solid #b9ded6; border-top-color: #07856f; border-radius: 50%; animation: t .8s linear infinite; }
    #chargement a { color: #07856f; font-weight: 700; }
    @keyframes t { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="chargement" role="status" aria-live="polite">
    <i aria-hidden="true"></i>
    <span>Chargement du formulaire « Enregistrer ma PFMP »…</span>
    <span id="secours" hidden>Le formulaire tarde à s’afficher : <a href="https://script.google.com/macros/s/AKfycbwQoKZOD2LeDyGqBRIVl6_uAPe6z3iGEW-w60ybCMu2Z3Rf4HAy-8ap_9FwFcKuHo7-qA/exec?page=declaration-entreprise">l’ouvrir directement</a>.</span>
  </div>
  <main class="cadre">
    <iframe id="formulaire" title="Enregistrer ma PFMP" src="https://script.google.com/macros/s/AKfycbwQoKZOD2LeDyGqBRIVl6_uAPe6z3iGEW-w60ybCMu2Z3Rf4HAy-8ap_9FwFcKuHo7-qA/exec?page=declaration-entreprise"
      allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    (function () {
      var c = document.getElementById('chargement');
      document.getElementById('formulaire').addEventListener('load', function () { c.hidden = true; });
      /* Réseau lent ou cadre bloqué : lien direct vers le formulaire après 15 secondes. */
      setTimeout(function () { if (!c.hidden) document.getElementById('secours').hidden = false; }, 15000);
    })();
  </script>
</body>
</html>
